<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuru Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body{margin:0;font-family:Arial, sans-serif;background:#000;color:#fff;overflow-x:hidden}
video.bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:-1}
.hero{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo3d{font-size:55px;font-weight:bold;background:linear-gradient(45deg,#00c3ff,#00ffcc);-webkit-background-clip:text;color:transparent;text-shadow:0 0 25px rgba(0,255,255,0.4)}
h1{font-size:40px}
.lang-toggle{position:fixed;top:20px;right:20px;background:#111;padding:10px;border-radius:20px;cursor:pointer}
.section{padding:60px 20px;text-align:center}
.packages{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:25px}
.card{background:rgba(255,255,255,0.07);backdrop-filter:blur(12px);padding:25px;border-radius:20px;cursor:pointer;transition:0.4s}
.card:hover{transform:translateY(-10px) scale(1.05)}
.details{display:none;text-align:left;margin-top:10px;color:#ddd}
.slider{display:flex;overflow:hidden;gap:10px;margin-top:30px}
.slider img{width:300px;border-radius:15px;animation:slide 20s linear infinite}
@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
#contactInfo span{display:block;margin:10px}
</style>
</head>
<body><video class="bg" autoplay muted loop>
<source src="https://cdn.coverr.co/videos/coverr-people-taking-photos-5175/1080p.mp4" type="video/mp4">
</video>
<div class="overlay"></div><div class="lang-toggle" onclick="toggleLang()">EN / አማ</div><div class="hero">
<div class="logo3d">KURU STUDIO</div>
<h1 id="title">Welcome</h1>
<p id="subtitle">እንኳን ደና መጡ</p>
</div><div class="section">
<h2>Gallery</h2>
<div class="slider">
<img src="https://images.unsplash.com/photo-1519741497674-611481863552">
<img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e">
<img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d">
</div>
</div><div class="section">
<h2 id="pkgTitle">Packages</h2>
<div class="packages"><div class="card" onclick="toggleDetails(this)">
<h3>Package 1</h3>
<div class="details">Full details included... 3500 birr</div>
</div><div class="card" onclick="toggleDetails(this)">
<h3>Package 2</h3>
<div class="details">Full details included... 5900 birr</div>
</div><div class="card" onclick="toggleDetails(this)">
<h3>Package 3</h3>
<div class="details">Full details included... 7500 birr</div>
</div><div class="card" onclick="toggleDetails(this)">
<h3>Package 4</h3>
<div class="details">Full details included... 9500 birr</div>
</div></div>
</div><div class="section">
<h2 id="contactTitle">Contact</h2>
<p id="contactInfo">
<span onclick="openLink('https://www.tiktok.com/@kuruphotography')"><i class="fa-brands fa-tiktok"></i> TikTok</span>
<span onclick="callNow('+251969060708')"><i class="fa-solid fa-phone"></i> Call</span>
<span onclick="openLink('https://t.me/Kurustudio')"><i class="fa-brands fa-telegram"></i> Telegram</span>
</p>
</div><script>
function toggleDetails(el){let d=el.querySelector('.details');d.style.display=d.style.display==='block'?'none':'block'}
function openLink(u){window.open(u,'_blank')}
function callNow(n){window.location.href='tel:'+n}
let am=false;
function toggleLang(){am=!am;
if(am){title.innerText='ኩሩ ስቱዲዮ';subtitle.innerText='Welcome';pkgTitle.innerText='ፓኬጆች';contactTitle.innerText='ኮንታክት'}
else{title.innerText='Welcome';subtitle.innerText='እንኳን ደና መጡ';pkgTitle.innerText='Packages';contactTitle.innerText='Contact'}}
</script></body>
</html>
